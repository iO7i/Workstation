[workspace]
members = ["crates/workstation-core", "crates/workstation-platform", "crates/workstation-cli"]
resolver = "2"

[workspace.package]
version = "0.5.0-alpha.1"
edition = "2021"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls", "json", "query"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
clap = { version = "=4.6.6", features = ["derive", "env"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
uuid = { version = "=1.24.0", features = ["v4"] }
time = { version = "=0.3.47", features = ["formatting", "parsing"] }
tempfile = "=3.27.0"
sha2 = "=0.10.9"
windows-sys = { version = "=0.61.2", features = [
 "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
 "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading",
 "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_SystemInformation"
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
